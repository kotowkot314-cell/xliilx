<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Xliilx - Игра</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; cursor: crosshair; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        // Получаем ник из ссылки
        const nick = new URLSearchParams(window.location.search).get('nick');
        if (!nick) window.location.href = '/';

        let myId = null;
        let players = {};
        let bullets = [];
        let mouse = { x: 0, y: 0 };
        let keys = {};

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Заходим в игру на сервере
        socket.emit('joinGame', nick);

        socket.on('init', (data) => {
            myId = data.selfId;
            players = data.players;
        });

        socket.on('playerJoined', (p) => players[p.id] = p);
        socket.on('playerLeft', (id) => delete players[id]);
        
        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
                players[data.id].angle = data.angle;
            }
        });

        socket.on('playerShot', (data) => {
            bullets.push({
                x: data.x, y: data.y, 
                vx: Math.cos(data.angle) * 15, 
                vy: Math.sin(data.angle) * 15, 
                life: 60
            });
        });

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mousedown', () => shoot());

        function shoot() {
            if (!myId || !players[myId]) return;
            const p = players[myId];
            const angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
            bullets.push({
                x: p.x, y: p.y, 
                vx: Math.cos(angle) * 15, 
                vy: Math.sin(angle) * 15, 
                life: 60
            });
            socket.emit('shoot', { x: p.x, y: p.y, angle: angle });
        }

        function loop() {
            if (myId && players[myId]) {
                const p = players[myId];
                let dx = 0, dy = 0;
                if (keys['w'] || keys['ц']) dy -= 5;
                if (keys['s'] || keys['ы']) dy += 5;
                if (keys['a'] || keys['ф']) dx -= 5;
                if (keys['d'] || keys['в']) dx += 5;

                if (dx !== 0 || dy !== 0) {
                    p.x += dx;
                    p.y += dy;
                    p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
                    socket.emit('move', { x: p.x, y: p.y, angle: p.angle });
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].vx;
                bullets[i].y += bullets[i].vy;
                bullets[i].life--;
                if (bullets[i].life <= 0) bullets.splice(i, 1);
            }

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#333';
            for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            for (let id in players) {
                const p = players[id];
                ctx.fillStyle = (id === myId) ? '#00ff00' : '#ff0000';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.username, p.x, p.y - 25);

                ctx.strokeStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + Math.cos(p.angle) * 25, p.y + Math.sin(p.angle) * 25);
                ctx.stroke();
            }

            ctx.fillStyle = '#ffff00';
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
