<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xliilx - Игра</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; user-select: none; }
        #hud { position: absolute; top: 10px; left: 10px; color: white; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px black; pointer-events: none; z-index: 10; }
        #ammo { position: absolute; bottom: 20px; right: 20px; color: white; font-size: 28px; font-weight: bold; text-shadow: 1px 1px 2px black; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        #bomb-timer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: red; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px black; display: none; z-index: 10; }
        #action-btn { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); padding: 15px 30px; background: #e63946; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; z-index: 20; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #action-btn:active { background: #ff4d5a; }
        #minimap-container { position: absolute; top: 15px; right: 15px; width: 140px; height: 140px; background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; overflow: hidden; z-index: 10; pointer-events: none; }
        #minimap-canvas { width: 100%; height: 100%; }
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); z-index: 20; touch-action: none; }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 55px; height: 55px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #shoot-btn { position: absolute; bottom: 60px; right: 50px; width: 80px; height: 80px; background: rgba(230, 57, 70, 0.6); border-radius: 50%; border: 2px solid #e63946; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; z-index: 20; touch-action: none; }
        #shoot-btn:active { background: rgba(230, 57, 70, 0.9); }
        #weapon-select { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 20; }
        .weap-btn { padding: 10px 20px; background: rgba(0,0,0,0.5); color: white; border: 1px solid #555; border-radius: 5px; font-weight: bold; touch-action: none; }
        .weap-btn.active { border-color: #e63946; color: #e63946; }
    </style>
</head>
<body>
    <div id="hud">HP: 100</div>
    <div id="ammo">30 / 90</div>
    <div id="crosshair"></div>
    <div id="bomb-timer">40</div>
    <div id="minimap-container"><canvas id="minimap-canvas" width="200" height="200"></canvas></div>
    <button id="action-btn">ЗАЛОЖИТЬ БОМБУ</button>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="shoot-btn">FIRE</div>
    <div id="weapon-select">
        <div class="weap-btn active" onclick="switchWeapon('rifle')">Автомат</div>
        <div class="weap-btn" onclick="switchWeapon('pistol')">Пистолет</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
        import { createMap } from './map.js';

        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const nick = urlParams.get('nick');
        const team = urlParams.get('team') || 'CT';
        if (!nick) window.location.href = '/';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa8d8ea);
        scene.fog = new THREE.Fog(0xa8d8ea, 80, 400);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -250;
        dirLight.shadow.camera.right = 250;
        dirLight.shadow.camera.top = 250;
        dirLight.shadow.camera.bottom = -250;
        dirLight.shadow.mapSize.width = 2048;
        scene.add(dirLight);

        const { mapObjects, floorSize } = createMap(scene, THREE);
        const matBomb = new THREE.MeshLambertMaterial({ color: 0xff0000 });

        let players = {};
        let myId = null;
        let bombObj = null;

        function createPlayerModel(username, team) {
            const group = new THREE.Group();
            const color = team === 'CT' ? 0x0000ff : 0xff0000;
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1, 4, 8), new THREE.MeshLambertMaterial({ color }));
            body.position.y = 1;
            group.add(body);
            return group;
        }

        socket.emit('joinGame', { username: nick, team: team });

        socket.on('init', (data) => {
            myId = data.selfId;
            players = data.players;
            for (let id in players) {
                if (id !== myId) {
                    const p = players[id];
                    const model = createPlayerModel(p.username, p.team);
                    model.position.set(p.x, 0, p.z);
                    scene.add(model);
                    players[id].model = model;
                }
            }
            if (data.bomb && data.bomb.planted) handleBombPlanted(data.bomb);
        });

        socket.on('playerJoined', (p) => {
            if (p.id !== myId) {
                const model = createPlayerModel(p.username, p.team);
                model.position.set(p.x, 0, p.z);
                scene.add(model);
                players[p.id] = { ...p, model };
            }
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].model.position.lerp(new THREE.Vector3(data.x, 0, data.z), 0.2);
                players[data.id].model.rotation.y = data.rotY;
            }
        });

        socket.on('playerLeft', (id) => {
            if (players[id]) {
                scene.remove(players[id].model);
                delete players[id];
            }
        });

        function handleBombPlanted(data) {
            if (!bombObj) {
                bombObj = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), matBomb);
                bombObj.position.set(data.x, 1, data.z);
                scene.add(bombObj);
            }
            document.getElementById('bomb-timer').style.display = 'block';
            document.getElementById('bomb-timer').innerText = data.timer;
        }

        socket.on('bombPlanted', (data) => handleBombPlanted(data));
        socket.on('bombTick', (timer) => {
            document.getElementById('bomb-timer').innerText = timer;
        });
        socket.on('gameOver', (winner) => {
            alert(winner === 'T' ? 'Террористы победили!' : 'Спецназ победил!');
            location.reload();
        });

        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (team === 'T') {
                socket.emit('plantBomb', { x: camera.position.x, z: camera.position.z });
                actionBtn.style.display = 'none';
            } else if (team === 'CT') {
                socket.emit('defuseBomb');
            }
        });

        function checkZones() {
            const px = camera.position.x;
            const pz = camera.position.z;
            const inA = Math.abs(px - 90) < 30 && Math.abs(pz - (-90)) < 30;
            const inB = Math.abs(px - (-90)) < 30 && Math.abs(pz - 90) < 30;
            
            if (team === 'T' && !bombObj && (inA || inB)) {
                actionBtn.innerText = 'ЗАЛОЖИТЬ БОМБУ';
                actionBtn.style.display = 'block';
            } else if (team === 'CT' && bombObj) {
                const dist = camera.position.distanceTo(bombObj.position);
                if (dist < 5) {
                    actionBtn.innerText = 'ОБЕЗВРЕДИТЬ';
                    actionBtn.style.display = 'block';
                } else actionBtn.style.display = 'none';
            } else actionBtn.style.display = 'none';
        }

        let moveX = 0, moveZ = 0, yaw = 0, pitch = 0;
        let playerPos = new THREE.Vector3(team === 'CT' ? 120 : -120, 1.6, team === 'CT' ? 120 : -120);
        let isShooting = false, lastShot = 0;

        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let joyActive = false;

        zone.addEventListener('pointerdown', (e) => {
            joyActive = true;
            zone.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        zone.addEventListener('pointermove', (e) => {
            if (!joyActive) return;
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = e.clientX - centerX;
            let dy = e.clientY - centerY;
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 45);
            const angle = Math.atan2(dy, dx);
            knob.style.transform = `translate(${Math.cos(angle)*dist - 27}px, ${Math.sin(angle)*dist - 27}px)`;
            moveX = Math.cos(angle) * (dist / 45);
            moveZ = Math.sin(angle) * (dist / 45);
            e.preventDefault();
        });

        zone.addEventListener('pointerup', () => {
            joyActive = false;
            knob.style.transform = 'translate(-50%, -50%)';
            moveX = 0;
            moveZ = 0;
        });

        let lookPointerId = null;
        let lastLookPos = { x: 0, y: 0 };

        document.body.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#joystick-zone') || e.target.closest('#shoot-btn') || e.target.closest('#action-btn') || e.target.closest('#weapon-select')) return;
            if (e.clientX > window.innerWidth / 3) {
                lookPointerId = e.pointerId;
                lastLookPos = { x: e.clientX, y: e.clientY };
            }
        });

        document.body.addEventListener('pointermove', (e) => {
            if (e.pointerId === lookPointerId) {
                yaw -= (e.clientX - lastLookPos.x) * 0.005;
                pitch -= (e.clientY - lastLookPos.y) * 0.005;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                lastLookPos = { x: e.clientX, y: e.clientY };
            }
        });

        document.body.addEventListener('pointerup', (e) => {
            if (e.pointerId === lookPointerId) lookPointerId = null;
        });

        renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            }
        });

        const keys = {};
        document.addEventListener('keydown', e => keys[e.code] = true);
        document.addEventListener('keyup', e => keys[e.code] = false);

        const shootBtn = document.getElementById('shoot-btn');
        shootBtn.addEventListener('pointerdown', (e) => { isShooting = true; shoot(); e.preventDefault(); });
        shootBtn.addEventListener('pointerup', () => { isShooting = false; });
        document.addEventListener('mousedown', () => { if(document.pointerLockElement === renderer.domElement) { isShooting = true; shoot(); } });
        document.addEventListener('mouseup', () => { isShooting = false; });

        let ammo = 30;

        function shoot() {
            const now = Date.now();
            if (now - lastShot < 120 || ammo <= 0) return;
            lastShot = now;
            ammo--;
            document.getElementById('ammo').innerText = `${ammo} / 90`;
            socket.emit('shoot', { x: playerPos.x, z: playerPos.z, rotY: yaw });
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-50)]), new THREE.LineBasicMaterial({ color: 0xffff00 }));
            camera.add(line);
            setTimeout(() => camera.remove(line), 50);
            if (ammo <= 0) setTimeout(() => { ammo = 30; document.getElementById('ammo').innerText = `${ammo} / 90`; }, 1000);
        }

        function switchWeapon(type) {}

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const delta = (performance.now() - lastTime) / 1000;
            lastTime = performance.now();

            let finalX = moveX;
            let finalZ = moveZ;
            if (keys['KeyW']) finalZ = -1;
            if (keys['KeyS']) finalZ = 1;
            if (keys['KeyA']) finalX = -1;
            if (keys['KeyD']) finalX = 1;

            if (finalX !== 0 || finalZ !== 0) {
                const len = Math.sqrt(finalX*finalX + finalZ*finalZ);
                finalX /= len;
                finalZ /= len;
                const speed = 6 * delta;
                const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
                const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
                const nextPos = playerPos.clone().add(forward.multiplyScalar(-finalZ * speed)).add(right.multiplyScalar(finalX * speed));
                
                let canMove = true;
                const pRadius = 0.5;
                for (let w of mapObjects) {
                    if (Math.abs(nextPos.x - w.x) < (w.w / 2 + pRadius) && Math.abs(nextPos.z - w.z) < (w.d / 2 + pRadius)) {
                        canMove = false;
                        break;
                    }
                }
                if (canMove) {
                    playerPos.copy(nextPos);
                    socket.emit('move', { x: playerPos.x, z: playerPos.z, rotY: yaw });
                }
            }

            camera.position.copy(playerPos);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            if (isShooting) shoot();
            checkZones();

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
