<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xliilx - Игра</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; user-select: none; }
        
        #hud { position: absolute; top: 10px; left: 10px; color: white; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px black; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        
        #bomb-timer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: red; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px black; display: none; z-index: 10; }
        
        /* Кнопки действий (Бомба) */
        #action-btn { 
            position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); 
            padding: 15px 30px; background: #e63946; color: white; border: none; 
            border-radius: 8px; font-weight: bold; font-size: 16px; z-index: 20; display: none; 
        }
        #action-btn:active { background: #ff4d5a; }

        /* Мини-карта */
        #minimap-container { position: absolute; top: 15px; right: 15px; width: 140px; height: 140px; background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; overflow: hidden; z-index: 10; pointer-events: none; }
        #minimap-canvas { width: 100%; height: 100%; }

        /* Управление */
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); z-index: 20; touch-action: none; }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 55px; height: 55px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #shoot-btn { position: absolute; bottom: 60px; right: 50px; width: 80px; height: 80px; background: rgba(230, 57, 70, 0.6); border-radius: 50%; border: 2px solid #e63946; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; z-index: 20; touch-action: none; }
        #shoot-btn:active { background: rgba(230, 57, 70, 0.9); }
    </style>
</head>
<body>
    <div id="hud">HP: 100</div>
    <div id="crosshair"></div>
    <div id="bomb-timer">40</div>
    
    <div id="minimap-container"><canvas id="minimap-canvas" width="200" height="200"></canvas></div>
    
    <button id="action-btn">ЗАЛОЖИТЬ БОМБУ (Удерживай)</button>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="shoot-btn">FIRE</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const nick = urlParams.get('nick');
        const team = urlParams.get('team') || 'CT';
        if (!nick) window.location.href = '/';

        // --- THREE.JS СЦЕНА ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa8d8ea);
        scene.fog = new THREE.Fog(0xa8d8ea, 80, 400);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Свет
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -250; dirLight.shadow.camera.right = 250;
        dirLight.shadow.camera.top = 250; dirLight.shadow.camera.bottom = -250;
        dirLight.shadow.mapSize.width = 2048;
        scene.add(dirLight);

        // Текстуры
        function createTexture(type) {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            if (type === 'whiteWall') { ctx.fillStyle = '#f5f5f0'; ctx.fillRect(0,0,128,128); for(let i=0; i<300; i++) { ctx.fillStyle = Math.random() > 0.8 ? '#e0e0d8' : '#ffffff'; ctx.fillRect(Math.random()*128, Math.random()*128, 3, 3); } }
            else if (type === 'stoneFloor') { ctx.fillStyle = '#d4c9b8'; ctx.fillRect(0,0,128,128); ctx.fillStyle = '#b8a88c'; for(let i=0; i<128; i+=32) { ctx.fillRect(0, i, 128, 3); for(let j=0; j<128; j+=32) { ctx.fillRect(j + (i%64===0?16:0), i, 3, 32); } } }
            else if (type === 'crate') { ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0,0,128,128); ctx.strokeStyle = '#5c3a21'; ctx.lineWidth = 8; ctx.strokeRect(4, 4, 120, 120); ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(124, 124); ctx.stroke(); ctx.beginPath(); ctx.moveTo(124, 4); ctx.lineTo(4, 124); ctx.stroke(); }
            else if (type === 'wood') { ctx.fillStyle = '#6b4c30'; ctx.fillRect(0,0,128,128); ctx.fillStyle = '#4a3320'; for(let i=0; i<128; i+=16) { ctx.fillRect(0, i, 128, 2); } }
            const texture = new THREE.CanvasTexture(canvas); texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }
        const texWall = createTexture('whiteWall'); const texFloor = createTexture('stoneFloor'); texFloor.repeat.set(60, 60);
        const texCrate = createTexture('crate'); const texWood = createTexture('wood');
        
        // Материалы
        const matWall = new THREE.MeshLambertMaterial({ map: texWall }); const matFloor = new THREE.MeshLambertMaterial({ map: texFloor });
        const matCrate = new THREE.MeshLambertMaterial({ map: texCrate }); const matWood = new THREE.MeshLambertMaterial({ map: texWood });
        const matRock = new THREE.MeshLambertMaterial({ color: 0x666666 }); const matGreen = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
        const matBomb = new THREE.MeshLambertMaterial({ color: 0xff0000 });

        // Карта
        const mapObjects = [];
        const floorSize = 350;
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(floorSize, floorSize), matFloor);
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

        function addBlock(x, y, z, w, h, d, mat, isCylinder = false) {
            let geo = isCylinder ? new THREE.CylinderGeometry(w/2, w/2, h, 16) : new THREE.BoxGeometry(w, h, d);
            const block = new THREE.Mesh(geo, mat); block.position.set(x, y, z); block.castShadow = true; block.receiveShadow = true;
            scene.add(block); mapObjects.push({ x, z, w, d, isCylinder }); return block;
        }

        // Границы
        const border = floorSize / 2;
        addBlock(0, 20, border, floorSize, 40, 20, matRock); addBlock(0, 20, -border, floorSize, 40, 20, matRock); 
        addBlock(border, 20, 0, 20, 40, floorSize, matRock); addBlock(-border, 20, 0, 20, 40, floorSize, matRock); 

        // Генерация карты (та же, что была)
        function createComplexHouse(cx, cz, width, depth, height) {
            const houseFloor = new THREE.Mesh(new THREE.BoxGeometry(width, 0.5, depth), matWood); houseFloor.position.set(cx, 0.25, cz); houseFloor.receiveShadow = true; scene.add(houseFloor);
            addBlock(cx, height/2, cz - depth/2, width, height, 2, matWall); addBlock(cx - width/2, height/2, cz, 2, height, depth, matWall); addBlock(cx + width/2, height/2, cz, 2, height, depth, matWall); 
            addBlock(cx - width/4, height/2, cz + depth/2, width/2 - 2, height, 2, matWall); addBlock(cx + width/4, height/2, cz + depth/2, width/2 - 2, height, 2, matWall); addBlock(cx, height - 3, cz + depth/2, 4, height - 6, 2, matWall); 
            addBlock(cx, height + 0.5, cz, width + 2, 1, depth + 2, matWall); 
            addBlock(cx - width/4, 2, cz - depth/4, 4, 4, 4, matCrate); addBlock(cx + width/4, 2, cz + depth/4, 3, 4, 3, matCrate);
        }
        addBlock(0, 5, 0, 35, 10, 35, matWall); addBlock(0, 15, 0, 20, 10, 20, matWall); 
        createComplexHouse(90, -90, 40, 30, 16); createComplexHouse(-90, 90, 40, 30, 14);
        createComplexHouse(130, 130, 30, 30, 14); createComplexHouse(-130, -130, 30, 30, 14); 
        createComplexHouse(-50, -90, 25, 25, 12); createComplexHouse(50, -90, 25, 25, 12); createComplexHouse(0, -110, 30, 20, 14);
        createComplexHouse(-50, 90, 25, 25, 12); createComplexHouse(50, 90, 25, 25, 12); createComplexHouse(0, 110, 30, 20, 14);
        createComplexHouse(-90, 0, 25, 30, 12); createComplexHouse(90, 0, 25, 30, 12);

        // --- ИГРОКИ И БОМБА ---
        let players = {}; let myId = null; let bombObj = null;

        function createPlayerModel(username, team) {
            const group = new THREE.Group();
            const color = team === 'CT' ? 0x0000ff : 0xff0000;
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1, 4, 8), new THREE.MeshLambertMaterial({ color }));
            body.position.y = 1; group.add(body);
            return group;
        }

        socket.emit('joinGame', { username: nick, team: team });

        socket.on('init', (data) => {
            myId = data.selfId; players = data.players;
            for (let id in players) {
                if (id !== myId) {
                    const p = players[id]; const model = createPlayerModel(p.username, p.team);
                    model.position.set(p.x, 0, p.z); scene.add(model);
                    players[id].model = model;
                }
            }
            if (data.bomb && data.bomb.planted) handleBombPlanted(data.bomb);
        });

        socket.on('playerJoined', (p) => {
            if (p.id !== myId) {
                const model = createPlayerModel(p.username, p.team);
                model.position.set(p.x, 0, p.z); scene.add(model);
                players[p.id] = { ...p, model };
            }
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) { players[data.id].model.position.lerp(new THREE.Vector3(data.x, 0, data.z), 0.2); players[data.id].model.rotation.y = data.rotY; }
        });

        socket.on('playerLeft', (id) => { if (players[id]) { scene.remove(players[id].model); delete players[id]; } });

        // --- ЛОГИКА БОМБЫ ---
        function handleBombPlanted(data) {
            if (!bombObj) {
                bombObj = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), matBomb);
                bombObj.position.set(data.x, 1, data.z); scene.add(bombObj);
            }
            document.getElementById('bomb-timer').style.display = 'block';
            document.getElementById('bomb-timer').innerText = data.timer;
        }

        socket.on('bombPlanted', (data) => handleBombPlanted(data));
        socket.on('bombTick', (timer) => { document.getElementById('bomb-timer').innerText = timer; });
        socket.on('gameOver', (winner) => { alert(winner === 'T' ? 'Террористы победили!' : 'Спецназ победил!'); location.reload(); });

        // Кнопка действия (Заложить/Обезвредить)
        const actionBtn = document.getElementById('action-btn');
        let isHoldingAction = false;
        let actionInterval = null;

        actionBtn.addEventListener('pointerdown', (e) => {
            isHoldingAction = true;
            e.preventDefault();
            if (team === 'T') {
                socket.emit('plantBomb', { x: camera.position.x, z: camera.position.z });
                actionBtn.style.display = 'none'; // Скрываем после закладки
            } else if (team === 'CT') {
                socket.emit('defuseBomb');
            }
        });
        actionBtn.addEventListener('pointerup', () => { isHoldingAction = false; });

        // Показывать кнопку, если мы в зоне А или Б
        function checkZones() {
            const px = camera.position.x, pz = camera.position.z;
            const inA = Math.abs(px - 90) < 30 && Math.abs(pz - (-90)) < 30;
            const inB = Math.abs(px - (-90)) < 30 && Math.abs(pz - 90) < 30;
            
            if (team === 'T' && !bombObj && (inA || inB)) {
                actionBtn.innerText = 'ЗАЛОЖИТЬ БОМБУ';
                actionBtn.style.display = 'block';
            } else if (team === 'CT' && bombObj) {
                const dist = camera.position.distanceTo(bombObj.position);
                if (dist < 5) { actionBtn.innerText = 'ОБЕЗВРЕДИТЬ (Удерживай)'; actionBtn.style.display = 'block'; }
                else actionBtn.style.display = 'none';
            } else {
                actionBtn.style.display = 'none';
            }
        }

        // --- УПРАВЛЕНИЕ (Джойстик, Мышь) ---
        // (Здесь я оставил старый код управления джойстиком и мышью, он работает)
        // ... (вставь сюда код джойстика из предыдущего сообщения, он не изменился) ...

        // Для сокращения кода, я пропущу дублирование джойстика, но он тут нужен.
        // Используй код джойстика из предыдущего сообщения (game.html).
    </script>
</body>
</html>
