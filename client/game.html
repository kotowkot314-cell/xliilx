<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xliilx - Игра</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; user-select: none; }
        
        /* HUD */
        #hud { position: absolute; top: 10px; left: 10px; color: white; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px black; pointer-events: none; z-index: 10; }
        #ammo { position: absolute; bottom: 20px; right: 20px; color: white; font-size: 28px; font-weight: bold; text-shadow: 1px 1px 2px black; pointer-events: none; z-index: 10; }
        #debug { position: absolute; top: 40px; left: 10px; color: #00ff00; font-size: 14px; z-index: 10; pointer-events: none;}
        
        /* Прицел */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }

        /* Джойстик (Слева) */
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 140px; height: 140px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); z-index: 20; touch-action: none; }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        /* Кнопка стрельбы (Справа) */
        #shoot-btn { position: absolute; bottom: 60px; right: 50px; width: 90px; height: 90px; background: rgba(230, 57, 70, 0.6); border-radius: 50%; border: 2px solid #e63946; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; z-index: 20; touch-action: none; }
        #shoot-btn:active { background: rgba(230, 57, 70, 0.9); }

        /* Смена оружия */
        #weapon-select { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 20; }
        .weap-btn { padding: 10px 20px; background: rgba(0,0,0,0.5); color: white; border: 1px solid #555; border-radius: 5px; font-weight: bold; touch-action: none; }
        .weap-btn.active { border-color: #e63946; color: #e63946; }
    </style>
</head>
<body>
    <div id="hud">HP: 100</div>
    <div id="debug">JOY: 0, 0</div>
    <div id="ammo">30 / 90</div>
    <div id="crosshair"></div>

    <!-- Управление -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="shoot-btn">FIRE</div>
    <div id="weapon-select">
        <div class="weap-btn active" onclick="switchWeapon('rifle')">Автомат</div>
        <div class="weap-btn" onclick="switchWeapon('pistol')">Пистолет</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const nick = urlParams.get('nick');
        const team = urlParams.get('team') || 'CT';
        if (!nick) window.location.href = '/';

        // --- THREE.JS СЦЕНА ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- КАРТА ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x555555 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const walls = [];
        function createWall(x, z, w, h, d) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: 0x888888 }));
            wall.position.set(x, h / 2, z);
            scene.add(wall);
            walls.push({ x, z, w, d });
        }
        
        createWall(0, 15, 40, 5, 1); 
        createWall(0, -15, 40, 5, 1); 
        createWall(15, 0, 1, 5, 40); 
        createWall(-15, 0, 1, 5, 40); 
        createWall(0, 0, 4, 2, 4); 
        createWall(5, 8, 2, 3, 2); 
        createWall(-6, -5, 3, 3, 3); 

        // --- ОРУЖИЕ ---
        const weaponGroup = new THREE.Group();
        camera.add(weaponGroup);
        scene.add(camera);

        const matBlack = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const matGrey = new THREE.MeshLambertMaterial({ color: 0x444444 });
        const matWood = new THREE.MeshLambertMaterial({ color: 0x5c3a21 });

        const rifleGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.4), matBlack); rifleGroup.add(body);
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4), matGrey); barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.02, -0.35); rifleGroup.add(barrel);
        const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.2, 0.1), matBlack); mag.position.set(0, -0.15, 0.05); mag.rotation.x = 0.2; rifleGroup.add(mag);
        const stock = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.25), matWood); stock.position.set(0, -0.02, 0.3); rifleGroup.add(stock);
        rifleGroup.position.set(0.25, -0.25, -0.5);
        weaponGroup.add(rifleGroup);

        const pistolGroup = new THREE.Group();
        const p_body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.25), matGrey); pistolGroup.add(p_body);
        const p_grip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.15, 0.08), matBlack); p_grip.position.set(0, -0.1, 0.08); p_grip.rotation.x = 0.3; pistolGroup.add(p_grip);
        const p_barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.15), matBlack); p_barrel.rotation.x = Math.PI / 2; p_barrel.position.set(0, 0.02, -0.15); pistolGroup.add(p_barrel);
        pistolGroup.position.set(0.25, -0.25, -0.4);
        pistolGroup.visible = false;
        weaponGroup.add(pistolGroup);

        let currentWeapon = 'rifle';
        let ammo = 30, maxAmmo = 90;
        document.getElementById('ammo').innerText = `${ammo} / ${maxAmmo}`;

        function switchWeapon(type) {
            currentWeapon = type;
            rifleGroup.visible = (type === 'rifle');
            pistolGroup.visible = (type === 'pistol');
            ammo = type === 'rifle' ? 30 : 12;
            maxAmmo = type === 'rifle' ? 90 : 36;
            document.getElementById('ammo').innerText = `${ammo} / ${maxAmmo}`;
            document.querySelectorAll('.weap-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.weap-btn')[type === 'rifle' ? 0 : 1].classList.add('active');
        }

        // --- ИГРОКИ ---
        let players = {};
        let myId = null;

        function createPlayerModel(username, team) {
            const group = new THREE.Group();
            const color = team === 'CT' ? 0x0000ff : 0xff0000;
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1, 4, 8), new THREE.MeshLambertMaterial({ color }));
            body.position.y = 1;
            group.add(body);
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(username, 128, 40);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
            sprite.position.y = 2.2; sprite.scale.set(2, 0.5, 1);
            group.add(sprite);
            return group;
        }

        socket.emit('joinGame', { username: nick, team: team });

        socket.on('init', (data) => {
            myId = data.selfId;
            for (let id in data.players) {
                if (id !== myId) {
                    const p = data.players[id];
                    const model = createPlayerModel(p.username, p.team);
                    model.position.set(p.x, 0, p.z);
                    scene.add(model);
                    players[id] = { data: p, model: model };
                }
            }
        });

        socket.on('playerJoined', (p) => {
            if (p.id !== myId) {
                const model = createPlayerModel(p.username, p.team);
                model.position.set(p.x, 0, p.z);
                scene.add(model);
                players[p.id] = { data: p, model: model };
            }
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].model.position.lerp(new THREE.Vector3(data.x, 0, data.z), 0.2);
                players[data.id].model.rotation.y = data.rotY;
            }
        });

        socket.on('playerLeft', (id) => {
            if (players[id]) { scene.remove(players[id].model); delete players[id]; }
        });

        // --- УПРАВЛЕНИЕ ---
        let moveX = 0, moveZ = 0;
        let yaw = 0, pitch = 0;
        let playerPos = new THREE.Vector3(0, 1.6, 0);
        let isShooting = false;
        let lastShot = 0;
        
        const debugDiv = document.getElementById('debug');

        // --- МОБИЛЬНЫЙ ДЖОЙСТИК ---
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let joyActive = false;

        zone.addEventListener('pointerdown', (e) => {
            joyActive = true;
            zone.setPointerCapture(e.pointerId); // Захватываем палец
            e.preventDefault();
        });

        zone.addEventListener('pointermove', (e) => {
            if (!joyActive) return;
            
            // Получаем координаты центра джойстика
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Вычисляем смещение
            let dx = e.clientX - centerX;
            let dy = e.clientY - centerY;
            
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
            const angle = Math.atan2(dy, dx);
            
            // Двигаем кружок визуально
            knob.style.transform = `translate(${Math.cos(angle)*dist - 30}px, ${Math.sin(angle)*dist - 30}px)`;
            
            // Значения для движения (от -1 до 1)
            moveX = Math.cos(angle) * (dist / 50);
            moveZ = Math.sin(angle) * (dist / 50);
            
            debugDiv.innerText = `JOY: ${moveX.toFixed(2)}, ${moveZ.toFixed(2)}`;
            e.preventDefault();
        });

        zone.addEventListener('pointerup', (e) => {
            joyActive = false;
            knob.style.transform = 'translate(-50%, -50%)';
            moveX = 0; moveZ = 0;
            debugDiv.innerText = `JOY: 0, 0`;
            e.preventDefault();
        });
        
        // Страховка (если палец ушел за пределы)
        zone.addEventListener('pointercancel', () => {
            joyActive = false;
            knob.style.transform = 'translate(-50%, -50%)';
            moveX = 0; moveZ = 0;
        });

        // --- ВРАЩЕНИЕ КАМЕРЫ (СВАЙП) ---
        let lookPointerId = null;
        let lastLookPos = { x: 0, y: 0 };

        document.body.addEventListener('pointerdown', (e) => {
            // Игнорируем клики по UI
            if (e.target.closest('#joystick-zone') || e.target.closest('#shoot-btn') || e.target.closest('#weapon-select')) return;
            
            // Если нажали на правую часть экрана
            if (e.clientX > window.innerWidth / 3) {
                lookPointerId = e.pointerId;
                lastLookPos = { x: e.clientX, y: e.clientY };
            }
        });

        document.body.addEventListener('pointermove', (e) => {
            if (e.pointerId === lookPointerId) {
                const dx = e.clientX - lastLookPos.x;
                const dy = e.clientY - lastLookPos.y;
                yaw -= dx * 0.005;
                pitch -= dy * 0.005;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                lastLookPos = { x: e.clientX, y: e.clientY };
                e.preventDefault();
            }
        });

        document.body.addEventListener('pointerup', (e) => {
            if (e.pointerId === lookPointerId) lookPointerId = null;
        });

        // --- СТРЕЛЬБА ---
        const shootBtn = document.getElementById('shoot-btn');
        shootBtn.addEventListener('pointerdown', (e) => { isShooting = true; shoot(); e.preventDefault(); });
        shootBtn.addEventListener('pointerup', () => { isShooting = false; });
        
        // ПК Управление
        document.addEventListener('mousedown', () => { if(document.pointerLockElement === renderer.domElement) { isShooting = true; shoot(); }});
        document.addEventListener('mouseup', () => { isShooting = false; });
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            }
        });
        renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());

        const keys = {};
        document.addEventListener('keydown', e => keys[e.code] = true);
        document.addEventListener('keyup', e => keys[e.code] = false);

        function shoot() {
            const now = Date.now();
            const cooldown = currentWeapon === 'rifle' ? 120 : 350;
            if (now - lastShot < cooldown || ammo <= 0) return;
            
            lastShot = now;
            ammo--;
            document.getElementById('ammo').innerText = `${ammo} / ${maxAmmo}`;
            
            weaponGroup.position.z = 0.06;
            setTimeout(() => weaponGroup.position.z = 0, 40);

            socket.emit('shoot', { x: playerPos.x, y: playerPos.y, z: playerPos.z, rotY: yaw });
            
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-50)]);
            const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xffff00 }));
            camera.add(line);
            setTimeout(() => camera.remove(line), 50);

            if (ammo <= 0) { setTimeout(() => { ammo = maxAmmo; document.getElementById('ammo').innerText = `${ammo} / ${maxAmmo}`; }, 1000); }
        }

        // --- ГЛАВНЫЙ ЦИКЛ ---
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - lastTime) / 1000;
            lastTime = time;

            let finalX = moveX;
            let finalZ = moveZ;

            // Добавляем клавиатуру
            if (keys['KeyW']) finalZ = -1;
            if (keys['KeyS']) finalZ = 1;
            if (keys['KeyA']) finalX = -1;
            if (keys['KeyD']) finalX = 1;

            if (finalX !== 0 || finalZ !== 0) {
                const len = Math.sqrt(finalX*finalX + finalZ*finalZ);
                finalX /= len; finalZ /= len;
                const speed = 6 * delta;
                
                const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
                const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
                
                const nextPos = playerPos.clone()
                    .add(forward.multiplyScalar(-finalZ * speed))
                    .add(right.multiplyScalar(finalX * speed));

                let canMove = true;
                const pRadius = 0.5;
                for (let w of walls) {
                    if (Math.abs(nextPos.x - w.x) < (w.w / 2 + pRadius) && 
                        Math.abs(nextPos.z - w.z) < (w.d / 2 + pRadius)) {
                        canMove = false;
                        break;
                    }
                }

                if (canMove) {
                    playerPos.copy(nextPos);
                    socket.emit('move', { x: playerPos.x, y: playerPos.y, z: playerPos.z, rotY: yaw });
                }
            }

            camera.position.copy(playerPos);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            if (isShooting) shoot();

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
