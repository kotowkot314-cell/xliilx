<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Xliilx - Игра 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; cursor: crosshair; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: rgba(255, 255, 255, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    
    <!-- Подключаем Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // Получаем данные из ссылки
        const urlParams = new URLSearchParams(window.location.search);
        const nick = urlParams.get('nick');
        const team = urlParams.get('team') || 'CT';
        
        if (!nick) window.location.href = '/';

        // --- НАСТРОЙКА THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Небо (голубое)
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // Туман

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- КАРТА (СТЕНЫ И ЯЩИКИ) ---
        const map = new THREE.Group();
        scene.add(map);

        // Пол (плоскость)
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        map.add(floor);

        // Функция создания стены
        function createWall(x, z, width, height, depth) {
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshLambertMaterial({ color: 0x888888 });
            const wall = new THREE.Mesh(geo, mat);
            wall.position.set(x, height / 2, z);
            map.add(wall);
        }

        // Строим карту (лабиринт)
        createWall(0, 10, 20, 5, 1); // Стена спереди
        createWall(0, -10, 20, 5, 1); // Стена сзади
        createWall(10, 0, 1, 5, 20); // Стена справа
        createWall(-10, 0, 1, 5, 20); // Стена слева
        createWall(0, 0, 4, 2, 4); // Ящик в центре
        createWall(5, 5, 2, 4, 2); // Ящик поменьше

        // --- ОРУЖИЕ ОТ ПЕРВОГО ЛИЦА ---
        const weaponGroup = new THREE.Group();
        camera.add(weaponGroup);
        scene.add(camera);

        // Создаем модель оружия (просто брусок для простоты)
        const gunGeo = new THREE.BoxGeometry(0.1, 0.1, 0.6);
        const gunMat = new THREE.MeshLambertMaterial({ color: 0x222222 }); // Темный металл
        const gun = new THREE.Mesh(gunGeo, gunMat);
        
        // Позиция оружия на экране (справа внизу)
        gun.position.set(0.3, -0.3, -0.5);
        weaponGroup.add(gun);

        // --- ИГРОКИ (ДРУГИЕ) ---
        let players = {};
        let myId = null;

        // Создание 3D модели игрока
        function createPlayerModel(username, team) {
            const group = new THREE.Group();
            
            // Тело (капсула)
            const bodyGeo = new THREE.CapsuleGeometry(0.3, 1, 4, 8);
            const color = team === 'CT' ? 0x0000ff : 0xff0000; // Синий для CT, Красный для T
            const bodyMat = new THREE.MeshLambertMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1; // Поднимаем над полом
            group.add(body);

            // Никнейм над головой (спрайт с текстом)
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(username, 128, 40);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.y = 2.2;
            sprite.scale.set(2, 0.5, 1);
            group.add(sprite);

            return group;
        }

        // --- УПРАВЛЕНИЕ ---
        const keys = {};
        let yaw = 0; // Поворот камеры по горизонтали
        let pitch = 0; // Поворот по вертикали
        let playerPos = new THREE.Vector3(0, 1.6, 0); // Позиция глаз игрока

        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // Захват мыши (Pointer Lock)
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                // Ограничиваем взгляд вверх/вниз
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            }
        });

        // Стрельба
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && document.pointerLockElement === renderer.domElement) {
                // Анимация отдачи (оружие дергается)
                gun.position.z = -0.4;
                setTimeout(() => gun.position.z = -0.5, 50);
                
                // Отправляем на сервер
                socket.emit('shoot', { x: playerPos.x, y: playerPos.y, z: playerPos.z, rotY: yaw });
                
                // Визуальный эффект выстрела (создаем линию)
                createBulletEffect();
            }
        });

        function createBulletEffect() {
            // Просто временная линия от центра экрана
            const geometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -50)
            ]);
            const material = new THREE.LineBasicMaterial({ color: 0xffff00 });
            const line = new THREE.Line(geometry, material);
            camera.add(line);
            setTimeout(() => camera.remove(line), 50);
        }

        // --- СЕТЬ ---
        socket.emit('joinGame', { username: nick, team: team });

        socket.on('init', (data) => {
            myId = data.selfId;
            for (let id in data.players) {
                if (id !== myId) {
                    const p = data.players[id];
                    const model = createPlayerModel(p.username, p.team);
                    model.position.set(p.x, 0, p.z);
                    scene.add(model);
                    players[id] = { data: p, model: model };
                }
            }
        });

        socket.on('playerJoined', (p) => {
            if (p.id !== myId) {
                const model = createPlayerModel(p.username, p.team);
                model.position.set(p.x, 0, p.z);
                scene.add(model);
                players[p.id] = { data: p, model: model };
            }
        });

        socket.on('playerMoved', (data) => {
            if (players[data.id]) {
                players[data.id].data.x = data.x;
                players[data.id].data.z = data.z;
                players[data.id].data.rotY = data.rotY;
                // Плавное движение (интерполяция)
                players[data.id].model.position.lerp(new THREE.Vector3(data.x, 0, data.z), 0.2);
                players[data.id].model.rotation.y = data.rotY;
            }
        });

        socket.on('playerLeft', (id) => {
            if (players[id]) {
                scene.remove(players[id].model);
                delete players[id];
            }
        });

        // --- ГЛАВНЫЙ ЦИКЛ ---
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - lastTime) / 1000;
            lastTime = time;

            // Движение
            const speed = 5 * delta;
            let moveX = 0, moveZ = 0;

            if (keys['KeyW']) moveZ -= 1;
            if (keys['KeyS']) moveZ += 1;
            if (keys['KeyA']) moveX -= 1;
            if (keys['KeyD']) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                // Нормализация диагонали
                const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                moveX /= length;
                moveZ /= length;

                // Движение относительно взгляда
                const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
                const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

                const nextPos = playerPos.clone()
                    .add(forward.multiplyScalar(moveZ * speed))
                    .add(right.multiplyScalar(moveX * speed));

                // Простая коллизия (чтобы не проходить сквозь стены)
                let canMove = true;
                // Проверяем ящик в центре (примерные координаты)
                if (Math.abs(nextPos.x) < 2.2 && Math.abs(nextPos.z) < 2.2) canMove = false;
                
                if (canMove) {
                    playerPos.copy(nextPos);
                    socket.emit('move', { x: playerPos.x, y: playerPos.y, z: playerPos.z, rotY: yaw });
                }
            }

            // Применяем позицию к камере
            camera.position.copy(playerPos);
            
            // Применяем поворот камеры
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Отрисовка
            renderer.render(scene, camera);
        }

        // Обработка ресайза
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
