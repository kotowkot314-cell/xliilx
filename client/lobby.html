<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xliilx - Лобби</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { text-align: center; padding: 20px; font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #e63946; }
        .teams { display: flex; flex: 1; }
        .team { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; padding: 20px; }
        .team:active { filter: brightness(0.8); }
        .ct { background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
        .t { background: linear-gradient(135deg, #78350f, #d97706); }
        .team h2 { font-size: 32px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .team p { font-size: 16px; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="header">ВЫБЕРИТЕ КОМАНДУ</div>
    <div class="teams">
        <div class="team ct" onclick="selectTeam('CT')">
            <h2>CT</h2>
            <p>M4A1 + USP</p>
        </div>
        <div class="team t" onclick="selectTeam('T')">
            <h2>T</h2>
            <p>AKR + Glock</p>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nick = urlParams.get('nick');
        if (!nick) window.location.href = '/';
        function selectTeam(team) {
            window.location.href = `/game.html?nick=${encodeURIComponent(nick)}&team=${team}`;
        }
    </script>
</body>
</html>
