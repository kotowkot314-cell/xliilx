<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xliilx - Лобби</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #111; color: #fff; height: 100vh; display: flex; overflow: hidden; }
        
        .sidebar { width: 70px; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 30px; }
        .icon-btn { width: 40px; height: 40px; background: #333; border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #888; font-size: 20px; cursor: pointer; }
        .icon-btn.active { background: #e63946; color: #fff; }

        .main-content { flex: 1; display: flex; padding: 20px; gap: 20px; }
        
        .profile-card { flex: 1; background: #222; border-radius: 12px; padding: 20px; border: 1px solid #333; position: relative; }
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .avatar { width: 80px; height: 80px; background: #444; border-radius: 12px; border: 2px solid #e63946; }
        .user-info h2 { font-size: 24px; margin-bottom: 5px; }
        .user-info p { color: #888; font-size: 14px; }
        
        .stats-bar { background: #111; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 1px solid #333; }
        .progress-bar { flex: 1; height: 8px; background: #333; border-radius: 4px; margin: 0 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: #f4a261; width: 0%; transition: width 0.3s; }

        .ranks { display: flex; gap: 10px; margin-top: 20px; }
        .rank-box { flex: 1; background: #1a1a1a; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .rank-box h3 { font-size: 14px; color: #888; margin-bottom: 5px; }
        .rank-box p { font-size: 18px; font-weight: bold; color: #fff; }

        .right-panel { width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .banner { flex: 1; background: linear-gradient(135deg, #e63946, #f4a261); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; }
        .banner h2 { font-size: 28px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .banner p { font-size: 14px; margin-bottom: 20px; }
        .play-btn { width: 100%; padding: 20px; background: #e63946; color: white; border: none; border-radius: 8px; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .play-btn:hover { background: #ff4d5a; transform: scale(1.02); }

        @media (max-width: 768px) {
            .main-content { flex-direction: column; overflow-y: auto; }
            .right-panel { width: 100%; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="icon-btn active">🏠</div>
        <div class="icon-btn">👤</div>
        <div class="icon-btn">🔫</div>
        <div class="icon-btn">🛒</div>
    </div>

    <div class="main-content">
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar"></div>
                <div class="user-info">
                    <h2 id="username-display">Загрузка...</h2>
                    <p id="id-display">ID: 000000</p>
                </div>
            </div>

            <div class="stats-bar">
                <span>Уровень <span id="level-display">1</span></span>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                <span><span id="exp-display">0</span> / 1000</span>
            </div>

            <div class="ranks">
                <div class="rank-box">
                    <h3>СОРЕВНОВАТЕЛЬНЫЙ</h3>
                    <p>КАЛИБРОВКА</p>
                </div>
                <div class="ranks">
                    <div class="rank-box">
                        <h3>СОЮЗНИКИ</h3>
                        <p>КАЛИБРОВКА</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="banner">
                <h2>STANDOFF X</h2>
                <p>Готов к бою?</p>
            </div>
            <button class="play-btn" onclick="startGame()">ИГРАТЬ</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nick = urlParams.get('nick');
        const rawId = urlParams.get('id');
        if (!nick) window.location.href = '/';
        
        const playerId = String(rawId).padStart(6, '0');
        
        document.getElementById('username-display').innerText = nick;
        document.getElementById('id-display').innerText = 'ID: ' + playerId;

        let level = parseInt(localStorage.getItem('level_' + playerId)) || 1;
        let exp = parseInt(localStorage.getItem('exp_' + playerId)) || 0;
        
        document.getElementById('level-display').innerText = level;
        document.getElementById('exp-display').innerText = exp;
        
        const progress = (exp / 1000) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';

        exp += 150;
        if (exp >= 1000) {
            level++;
            exp = exp - 1000;
        }
        localStorage.setItem('level_' + playerId, level);
        localStorage.setItem('exp_' + playerId, exp);

        function startGame() {
            window.location.href = `/game.html?nick=${encodeURIComponent(nick)}&team=CT`;
        }
    </script>
</body>
</html>
